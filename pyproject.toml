[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelbot"
version = "1.0.0"
description = "Automated English-learning Instagram Reels generator and publisher"
requires-python = ">=3.10"
dependencies = [
    "google-genai==2.18.1",
    "edge-tts>=7.2.7",
    "moviepy==1.0.3",
    "instagrapi==2.4.1",
    "Pillow==11.3.0",
    "numpy==2.2.6",
    "python-dotenv==1.1.0",
    "requests==2.33.0",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
reelbot = "reelbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reelbot = ["content/*.json", "web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
